name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify VERSION matches tag and pyproject
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VFILE=$(tr -d '[:space:]' < VERSION)
          PYPROJ=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$TAG" != "$VFILE" ] || [ "$VFILE" != "$PYPROJ" ]; then
            echo "::error::version mismatch — tag=$TAG VERSION=$VFILE pyproject=$PYPROJ"
            exit 1
          fi
          echo "Versions in sync: $VFILE"

  build-macos:
    needs: version-check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # build.sh provisions its own relocatable standalone CPython for the
      # bundle and validates it (ssl + psutil + openai).
      - name: Build DMG
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd swift
          ./build.sh release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: swift/.build/SysControl.dmg

  build-windows:
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra gui --extra build

      - name: Build Windows bundle (PyInstaller)
        run: uv run pyinstaller SysControl.spec --noconfirm

      - name: Smoke-test the frozen bundle (deps + TLS import)
        run: |
          $p = Start-Process -FilePath dist/SysControl/SysControl.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed ($($p.ExitCode))"; exit 1 }
          echo "frozen bundle selftest OK"

      - name: Zip bundle
        run: Compress-Archive -Path dist/SysControl/* -DestinationPath SysControl-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: SysControl-windows-x64.zip

  release:
    needs: [build-macos, build-windows]
    # Publish whatever built: a failure on one platform must NOT block the
    # other's installer from shipping (e.g. a broken Windows PyInstaller build
    # must never hold back the macOS DMG, and vice versa). Waits for both jobs
    # to finish, then runs as long as at least one produced an artifact.
    if: ${{ !cancelled() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SysControl v${{ steps.version.outputs.version }}"
          fail_on_unmatched_files: false   # attach whichever installer(s) built
          files: |
            artifacts/macos-dmg/SysControl.dmg
            artifacts/windows-zip/SysControl-windows-x64.zip
          body: |
            ## SysControl v${{ steps.version.outputs.version }}

            Pick the installer for your operating system below.

            ### macOS 14+ (`SysControl.dmg`)
            1. Download `SysControl.dmg`
            2. Open it and drag **SysControl.app** to your Applications folder
            3. First launch — Gatekeeper bypass (the app is not notarized):
               - Right-click the app icon → **Open**, then click **Open**, **or**
               - Run once in Terminal:
                 ```
                 xattr -r -d com.apple.quarantine /Applications/SysControl.app
                 ```

            ### Windows 11 (x64) (`SysControl-windows-x64.zip`)
            1. Download `SysControl-windows-x64.zip`
            2. Unzip anywhere (e.g. `%LOCALAPPDATA%\Programs\SysControl`)
            3. Run **SysControl.exe**. On first launch, SmartScreen may warn
               (the build is unsigned) → **More info → Run anyway**

            ### Requirements
            - For local models: [Ollama](https://ollama.com) installed and running (`ollama pull qwen3:30b`)
            - For cloud: an Ollama Cloud API key
            - The cross-platform CLI is also available directly from GitHub:
              `uv tool install git+https://github.com/ks6573/SysControl.git`
