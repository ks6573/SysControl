[project]
name = "syscontrol"
version = "1.16.0"
description = "All-In-One AI agent with MCP tool server; Ultron but slightly weaker and nicer 😉"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mcp", "system-monitor", "ollama", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "psutil>=7.2,<8",
    "matplotlib>=3.10,<4",
    "openai>=2.38,<3",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "pypdf>=6.12,<7",
    "prompt-toolkit>=3.0.52",
    # Native macOS Keychain / Windows Credential Manager with a file fallback
    # for headless Linux environments that do not provide a keyring backend.
    "keyring>=25.7,<26",
    # Cross-platform tool backends (clipboard, recycle-bin delete).
    "pyperclip>=1.9",
    "send2trash>=1.8",
    # Windows-only tool backends (volume, toast notifications).  Gated by an
    # environment marker so macOS/Linux installs don't pull them in.
    "pycaw>=20240210 ; sys_platform == 'win32'",
    "winotify>=1.1.0 ; sys_platform == 'win32'",
]

[project.scripts]
syscontrol        = "agent.cli:main"
syscontrol-server = "mcp.server:main"
syscontrol-gui    = "flet_app.main:main"

[project.optional-dependencies]
gpu = [
    "nvidia-ml-py>=13.0",
]
gui = [
    "flet>=0.24",
]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "ruff>=0.15",
    "mypy>=2.1",
    "pytest>=9.0",
    "pytest-cov>=7.1",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package layout: root shims + both sub-packages.
include = ["agent.py", "agent/", "mcp/", "deep_research/", "flet_app/"]


# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "mcp", "deep_research"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
warn_unused_ignores    = true
warn_return_any        = true
pretty                 = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source  = ["agent", "mcp"]
omit    = [".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
